stages:
  - build
  - test-backend

build-project:
  image: python:3.10
  stage: build
  script:
    - echo "Creating env..."
    - python -m venv env
    - echo "Created env. Activating env..."
    - source env/bin/activate
    - echo "Installing dependencies"
    - pip install -e .
    - echo "Dependencies installed. Deactivating..."
    - deactivate
    - echo "Build successful!"

  artifacts:
    paths:
      - env/

test-project:
  image: python:3.10
  stage: test-backend
  script:
    - cd team_10_application
    - python manage.py test
    - echo "Django tests complete!"