stages:
  - build
  - test-backend

variables:
  MYSQL_DATABASE: $DB_NAME
  MYSQL_ROOT_PASSWORD: $DB_PASSWORD
  # MYSQL_USER: $DB_USERNAME
  # MYSQL_PASSWORD: $PASSWORD

default:
  image: python:3.10
  services:
    - name: mysql:8.0
      alias: mysql

build-project:
  stage: build
  script:
    - echo "Creating env..."
    - python -m venv env
    - echo "Created env. Activating env..."
    - source env/bin/activate
    - echo "Installing dependencies"
    - pip install -e .
    - echo "Dependencies installed. Creating migrations..."
    # - cd team_10_application
    # - python manage.py makemigrations
    # - python manage.py migrate
    - cd ..
    - echo "Deactivating..."
    - deactivate
    - echo "Build successful!"

  artifacts:
    paths:
      - env/

test-project:
  stage: test-backend
  script:
    - echo "activating virtual env..."
    - source env/bin/activate
    - cd team_10_application
    - echo "Running tests..."
    - python manage.py test
    - echo "Django tests complete!"