stages:
  - build
  - test

build-project:
  image: python:3.10
  stage: build
  script:
    - echo "Creating env..."
    - python -m venv env
    - echo "Created env. Activating env..."
    - source env/bin/activate
    - echo "Installing dependencies"
    - pip install -e .
    - echo "Dependencies installed. Deactivating..."
    - deactivate
    - echo "Build successful!"

  artifacts:
    paths:
      - env/
